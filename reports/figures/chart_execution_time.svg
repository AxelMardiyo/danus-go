<svg xmlns="http://www.w3.org/2000/svg" width="850" height="470" viewBox="0 0 850 470" style="background-color: #FFFFFF; font-family: Arial, sans-serif;">
  <!-- Judul dan Sub-judul -->
  <text x="425" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1B365D">Perbandingan Waktu Eksekusi Kueri: Sebelum vs Sesudah Optimasi (Bab 7)</text>
  <text x="425" y="52" text-anchor="middle" font-size="11" fill="#64748b">Pengukuran Rata-rata Execution Time (ms) pada PostgreSQL 16 (105.001 Pesanan)</text>

  <!-- Legend Bebas Tabrakan -->
  <rect x="420" y="68" width="16" height="12" fill="#E53E3E" rx="3"/>
  <text x="444" y="78" font-size="11" font-weight="bold" fill="#4A5568">Tanpa Indeks (Baseline)</text>

  <rect x="630" y="68" width="16" height="12" fill="#3182CE" rx="3"/>
  <text x="654" y="78" font-size="11" font-weight="bold" fill="#4A5568">Dengan Indeks Sekunder</text>

  <!-- Garis Sumbu Utama -->
  <line x1="85" y1="350" x2="800" y2="350" stroke="#CBD5E0" stroke-width="1.5"/>
  <line x1="85" y1="90" x2="85" y2="350" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="-220" y="26" text-anchor="middle" transform="rotate(-90)" font-size="11" font-weight="bold" fill="#4A5568">Execution Time (milidetik)</text>

  <!-- Grid Horisontal dan Label Y-Axis (Skala 0 - 24 ms) -->
  <line x1="85" y1="350" x2="800" y2="350" stroke="#EDF2F7" stroke-width="1"/>
  <text x="75" y="354" text-anchor="end" font-size="10" fill="#718096">0.0 ms</text>

  <line x1="85" y1="298" x2="800" y2="298" stroke="#EDF2F7" stroke-width="1" stroke-dasharray="3"/>
  <text x="75" y="302" text-anchor="end" font-size="10" fill="#718096">5.0 ms</text>

  <line x1="85" y1="246" x2="800" y2="246" stroke="#EDF2F7" stroke-width="1" stroke-dasharray="3"/>
  <text x="75" y="250" text-anchor="end" font-size="10" fill="#718096">10.0 ms</text>

  <line x1="85" y1="194" x2="800" y2="194" stroke="#EDF2F7" stroke-width="1" stroke-dasharray="3"/>
  <text x="75" y="198" text-anchor="end" font-size="10" fill="#718096">15.0 ms</text>

  <line x1="85" y1="142" x2="800" y2="142" stroke="#EDF2F7" stroke-width="1" stroke-dasharray="3"/>
  <text x="75" y="146" text-anchor="end" font-size="10" fill="#718096">20.0 ms</text>

  <line x1="85" y1="100" x2="800" y2="100" stroke="#EDF2F7" stroke-width="1" stroke-dasharray="3"/>
  <text x="75" y="104" text-anchor="end" font-size="10" fill="#718096">24.0 ms</text>

  <!-- ================= GROUP 1: S1 Radar Sesi ================= -->
  <!-- Red: 0.28 ms -> h=5px -->
  <rect x="120" y="345" width="38" height="5" fill="#E53E3E" rx="2"/>
  <text x="139" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#C53030">0.28</text>

  <!-- Blue: 0.03 ms -> h=2px -->
  <rect x="165" y="348" width="38" height="2" fill="#3182CE" rx="1"/>
  <text x="184" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#2B6CB0">0.03</text>

  <text x="162" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">1. Radar Sesi</text>
  <text x="162" y="388" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">Speedup: 11.2x</text>

  <!-- ================= GROUP 2: S2 Riwayat User ================= -->
  <!-- Red: 3.71 ms -> h=39px -->
  <rect x="255" y="311" width="38" height="39" fill="#E53E3E" rx="3"/>
  <text x="274" y="303" text-anchor="middle" font-size="10" font-weight="bold" fill="#C53030">3.71</text>

  <!-- Blue: 0.06 ms -> h=2px -->
  <rect x="300" y="348" width="38" height="2" fill="#3182CE" rx="1"/>
  <text x="319" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="#2B6CB0">0.06</text>

  <text x="297" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">2. Riwayat User</text>
  <text x="297" y="388" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">Speedup: 59.0x</text>

  <!-- ================= GROUP 3: S3 Omzet Bulan ================= -->
  <!-- Red: 19.25 ms -> h=200px -->
  <rect x="390" y="150" width="38" height="200" fill="#E53E3E" rx="3"/>
  <text x="409" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#C53030">19.25</text>

  <!-- Blue: 20.73 ms -> h=216px -->
  <rect x="435" y="134" width="38" height="216" fill="#3182CE" rx="3"/>
  <text x="454" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#2B6CB0">20.73</text>

  <text x="432" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">3. Omzet Bulan</text>
  <text x="432" y="388" text-anchor="middle" font-size="10" fill="#64748b">Pruning Aktif</text>

  <!-- ================= GROUP 4: S4 Antrean Seller ================= -->
  <!-- Red: 8.99 ms -> h=94px -->
  <rect x="525" y="256" width="38" height="94" fill="#E53E3E" rx="3"/>
  <text x="544" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#C53030">8.99</text>

  <!-- Blue: 4.88 ms -> h=51px -->
  <rect x="570" y="299" width="38" height="51" fill="#3182CE" rx="3"/>
  <text x="589" y="291" text-anchor="middle" font-size="10" font-weight="bold" fill="#2B6CB0">4.88</text>

  <text x="567" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">4. Antrean Seller</text>
  <text x="567" y="388" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">Speedup: 1.8x</text>

  <!-- ================= GROUP 5: S5 Sargable Range ================= -->
  <!-- Red: 0.11 ms -> h=4px -->
  <rect x="660" y="346" width="38" height="4" fill="#E53E3E" rx="2"/>
  <text x="679" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#C53030">0.11</text>

  <!-- Blue: 0.03 ms -> h=2px -->
  <rect x="705" y="348" width="38" height="2" fill="#3182CE" rx="1"/>
  <text x="724" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#2B6CB0">0.03</text>

  <text x="702" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">5. Sargable Range</text>
  <text x="702" y="388" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">Speedup: 4.0x</text>

  <!-- Bottom Annotation Box -->
  <rect x="85" y="414" width="715" height="34" fill="#F8FAFC" stroke="#CBD5E1" rx="6" />
  <text x="442" y="435" font-size="11" fill="#475569" text-anchor="middle">
    Catatan: Indeks sekunder B-Tree memangkas latensi hingga 59x lipat pada skenario operasional pengguna.
  </text>
</svg>
