<svg xmlns="http://www.w3.org/2000/svg" width="850" height="460" viewBox="0 0 850 460" style="background-color: #FFFFFF; font-family: Arial, sans-serif;">
  <!-- Judul dan Sub-judul -->
  <text x="425" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1B365D">Evaluasi Khusus Sargability: date() vs Rentang Waktu (Bab 7)</text>
  <text x="425" y="52" text-anchor="middle" font-size="11" fill="#64748b">Komparasi Performa Predikat Kueri Identik pada 105.001 Baris Pesanan (PostgreSQL 16)</text>

  <!-- ================= PANEL KIRI: WAKTU EKSEKUSI ================= -->
  <rect x="45" y="75" width="365" height="300" fill="#F8FAFC" stroke="#CBD5E1" rx="8" />
  <text x="227" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Waktu Eksekusi (Execution Time)</text>
  <text x="227" y="118" text-anchor="middle" font-size="10" fill="#64748b">Semakin Rendah Semakin Cepat (ms)</text>

  <!-- Badge Speedup Kiri (Diletakkan di area atas bebas tabrakan) -->
  <rect x="127" y="132" width="200" height="26" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" rx="5" />
  <text x="227" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">Akselerasi: 250.3x Lebih Cepat!</text>

  <!-- Sumbu Horisontal Panel Kiri -->
  <line x1="75" y1="300" x2="380" y2="300" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Batang Non-Sargable (6.76 ms) -->
  <rect x="105" y="180" width="85" height="120" fill="#E53E3E" rx="4" />
  <text x="147" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#C53030">6.76 ms</text>
  <text x="147" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Non-Sargable</text>
  <text x="147" y="336" text-anchor="middle" font-size="10" fill="#64748b">date(col) = ...</text>
  <text x="147" y="352" text-anchor="middle" font-size="9" font-weight="bold" fill="#DC2626">Seq Scan (11 Partisi)</text>

  <!-- Batang Sargable (0.03 ms) -->
  <rect x="255" y="297" width="85" height="3" fill="#10B981" rx="1" />
  <text x="297" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">0.03 ms</text>
  <text x="297" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Sargable Range</text>
  <text x="297" y="336" text-anchor="middle" font-size="10" fill="#64748b">col &gt;= .. AND &lt; ..</text>
  <text x="297" y="352" text-anchor="middle" font-size="9" font-weight="bold" fill="#059669">Index Only Scan</text>

  <!-- ================= PANEL KANAN: KONSUMSI BUFFER I/O ================= -->
  <rect x="440" y="75" width="365" height="300" fill="#F8FAFC" stroke="#CBD5E1" rx="8" />
  <text x="622" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Konsumsi Buffer I/O Memori</text>
  <text x="622" y="118" text-anchor="middle" font-size="10" fill="#64748b">Jumlah Blok Halaman 8 KB Disentuh</text>

  <!-- Badge Penghematan Kanan (Diletakkan di area atas bebas tabrakan) -->
  <rect x="522" y="132" width="200" height="26" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" rx="5" />
  <text x="622" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#1D4ED8">Efisiensi I/O: 90.5% Dihemat!</text>

  <!-- Sumbu Horisontal Panel Kanan -->
  <line x1="470" y1="300" x2="775" y2="300" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Batang Non-Sargable (346 blok) -->
  <rect x="500" y="180" width="85" height="120" fill="#E53E3E" rx="4" />
  <text x="542" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#C53030">346 Blok</text>
  <text x="542" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Non-Sargable</text>
  <text x="542" y="336" text-anchor="middle" font-size="10" fill="#64748b">date(col) = ...</text>
  <text x="542" y="352" text-anchor="middle" font-size="9" font-weight="bold" fill="#DC2626">2.768 kB Memori</text>

  <!-- Batang Sargable (33 blok) -->
  <rect x="650" y="287" width="85" height="13" fill="#3B82F6" rx="2" />
  <text x="692" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">33 Blok</text>
  <text x="692" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Sargable Range</text>
  <text x="692" y="336" text-anchor="middle" font-size="10" fill="#64748b">col &gt;= .. AND &lt; ..</text>
  <text x="692" y="352" text-anchor="middle" font-size="9" font-weight="bold" fill="#2563EB">264 kB Memori</text>

  <!-- Bottom Summary Banner -->
  <rect x="45" y="395" width="760" height="38" fill="#F1F5F9" stroke="#CBD5E1" rx="6" />
  <text x="425" y="418" font-size="11" fill="#334155" text-anchor="middle">
    Prinsip Sargability: Menghindari pemanggilan fungsi pada klausa WHERE mengaktifkan pohon B-Tree dan memangkas 90,5% I/O.
  </text>
</svg>
