<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" height="100%" style="font-family: Arial, sans-serif; background-color: #ffffff;">
  <!-- Judul dan Sub-judul -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Alur Algoritma Pemulihan ARIES &amp; Logging WAL (Bab 4)</text>
  <text x="480" y="52" font-size="12" fill="#64748b" text-anchor="middle">Siklus Pemulihan Otomatis Pasca Crash (SIGKILL) pada Engine PostgreSQL 16</text>

  <!-- ================= TOP FLOW: RUNTIME TO CRASH ================= -->
  <!-- 1. Checkpoint -->
  <rect x="45" y="75" width="180" height="88" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.8" rx="6" />
  <text x="135" y="101" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">1. Checkpoint</text>
  <text x="135" y="122" font-size="11" fill="#475569" text-anchor="middle">Redo LSN Tercatat</text>
  <text x="135" y="140" font-size="10" fill="#64748b" text-anchor="middle">Flush Dirty Buffers</text>

  <!-- Panah 1 -> 2 -->
  <line x1="225" y1="119" x2="262" y2="119" stroke="#3b82f6" stroke-width="2" />
  <polygon points="270,119 260,114 260,124" fill="#3b82f6" />

  <!-- 2. Transaksi Konkuren -->
  <rect x="270" y="75" width="190" height="88" fill="#f8fafc" stroke="#0284c7" stroke-width="1.8" rx="6" />
  <text x="365" y="101" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">2. Transaksi Konkuren</text>
  <text x="365" y="122" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">T1, T3 (COMMITTED)</text>
  <text x="365" y="140" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">T2, T4 (IN-FLIGHT)</text>

  <!-- Panah 2 -> 3 -->
  <line x1="460" y1="119" x2="497" y2="119" stroke="#ef4444" stroke-width="2" />
  <polygon points="505,119 495,114 495,124" fill="#ef4444" />

  <!-- 3. Titik Crash -->
  <rect x="505" y="73" width="160" height="92" fill="#fef2f2" stroke="#ef4444" stroke-width="2.2" rx="6" />
  <text x="585" y="99" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">TITIK CRASH</text>
  <text x="585" y="121" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Sinyal SIGKILL</text>
  <text x="585" y="140" font-size="10" fill="#7f1d1d" text-anchor="middle">Postmaster Terminasi</text>

  <!-- Panah 3 -> 4 -->
  <line x1="665" y1="119" x2="702" y2="119" stroke="#16a34a" stroke-width="2" />
  <polygon points="710,119 700,114 700,124" fill="#16a34a" />

  <!-- 4. Startup Recovery -->
  <rect x="710" y="73" width="205" height="92" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6" />
  <text x="812" y="97" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">4. Startup Recovery</text>
  <text x="812" y="117" font-size="10" fill="#166534" text-anchor="middle">Auto-Recovery Aktif</text>
  <text x="812" y="133" font-size="10" fill="#4b5563" text-anchor="middle">pg_control: IN_PRODUCTION</text>
  <text x="812" y="150" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Pindai Berkas pg_wal</text>

  <!-- Panah Turun ke 3 Fase ARIES -->
  <line x1="812" y1="165" x2="812" y2="190" stroke="#16a34a" stroke-width="2" />
  <line x1="185" y1="190" x2="812" y2="190" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" />
  <polygon points="185,203 180,193 190,193" fill="#3b82f6" />
  <polygon points="480,203 475,193 485,193" fill="#ca8a04" />
  <polygon points="775,203 770,193 780,193" fill="#9333ea" />

  <!-- ================= BOTTOM ROW: 3 FASE ARIES ================= -->
  <!-- Fase 1: Analysis -->
  <rect x="45" y="205" width="280" height="175" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" rx="8" />
  <text x="185" y="230" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">FASE 1: ANALYSIS</text>
  <text x="185" y="248" font-size="10" fill="#64748b" text-anchor="middle">Pindai Maju dari Checkpoint Terakhir</text>
  <line x1="60" y1="258" x2="310" y2="258" stroke="#cbd5e1" stroke-width="1" />
  <text x="65" y="278" font-size="10" fill="#334155">• Baca record RUNNING_XACTS</text>
  <text x="65" y="298" font-size="10" fill="#334155">• Identifikasi Losers: TxID [990, 992]</text>
  <text x="65" y="318" font-size="10" fill="#334155">• Tentukan titik RedoLSN terkecil</text>
  <rect x="65" y="336" width="240" height="26" fill="#dbeafe" rx="4" />
  <text x="185" y="353" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Redo Mulai: LSN 0/82E7C70</text>

  <!-- Panah Fase 1 -> Fase 2 -->
  <line x1="325" y1="290" x2="338" y2="290" stroke="#94a3b8" stroke-width="2" />

  <!-- Fase 2: Redo -->
  <rect x="340" y="205" width="280" height="175" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8" rx="8" />
  <text x="480" y="230" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">FASE 2: REDO</text>
  <text x="480" y="248" font-size="10" fill="#64748b" text-anchor="middle">Repeating History (Semua Transaksi)</text>
  <line x1="355" y1="258" x2="605" y2="258" stroke="#cbd5e1" stroke-width="1" />
  <text x="360" y="278" font-size="10" fill="#334155">• Ulangi HOT_UPDATE T1, T2, T3</text>
  <text x="360" y="298" font-size="10" fill="#334155">• Rekonstruksi blok data di memori</text>
  <text x="360" y="318" font-size="10" fill="#334155">• Verifikasi PageLSN secara idempoten</text>
  <rect x="360" y="336" width="240" height="26" fill="#fef08a" rx="4" />
  <text x="480" y="353" font-size="10" font-weight="bold" fill="#a16207" text-anchor="middle">Status RAM Identik Pra-Crash</text>

  <!-- Panah Fase 2 -> Fase 3 -->
  <line x1="620" y1="290" x2="633" y2="290" stroke="#94a3b8" stroke-width="2" />

  <!-- Fase 3: Undo -->
  <rect x="635" y="205" width="280" height="175" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" rx="8" />
  <text x="775" y="230" font-size="13" font-weight="bold" fill="#6b21a8" text-anchor="middle">FASE 3: UNDO (MVCC)</text>
  <text x="775" y="248" font-size="10" fill="#64748b" text-anchor="middle">Eliminasi Efek Transaksi Losers</text>
  <line x1="650" y1="258" x2="900" y2="258" stroke="#cbd5e1" stroke-width="1" />
  <text x="655" y="278" font-size="10" fill="#334155">• Tandai Losers ABORTED di pg_xact</text>
  <text x="655" y="298" font-size="10" fill="#334155">• Visibilitas Heap abaikan baris abort</text>
  <text x="655" y="318" font-size="10" fill="#334155">• Tanpa penulisan rollback fisik!</text>
  <rect x="655" y="336" width="240" height="26" fill="#f3e8ff" rx="4" />
  <text x="775" y="353" font-size="10" font-weight="bold" fill="#7e22ce" text-anchor="middle">Stok Konsisten: Sisa 90 / 80</text>

  <!-- ================= STATUS BANNER BAWAH ================= -->
  <rect x="80" y="405" width="800" height="36" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="6" />
  <text x="480" y="428" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">
    DATABASE SIAP MENERIMA KONEKSI · INTEGRITAS DATA ACID 100% TERBUKTI EMPIRIS
  </text>
</svg>
