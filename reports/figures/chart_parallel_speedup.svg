<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%" style="font-family: Arial, sans-serif; background-color: #ffffff;">
  <!-- Judul dan Sub-judul -->
  <text x="425" y="32" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Evaluasi Skalabilitas Paralel: Waktu Eksekusi vs Speedup (Bab 9)</text>
  <text x="425" y="52" font-size="11" fill="#64748b" text-anchor="middle">Agregasi Multi-Dimensi Pesanan (105k Pesanan + 144k Detail) pada PostgreSQL 16</text>

  <!-- Sumbu dan Garis Grid Horisontal -->
  <line x1="90" y1="80" x2="90" y2="320" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="90" y1="320" x2="770" y2="320" stroke="#cbd5e1" stroke-width="1.5" />

  <line x1="90" y1="240" x2="770" y2="240" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4" />
  <line x1="90" y1="160" x2="770" y2="160" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4" />
  <line x1="90" y1="80" x2="770" y2="80" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4" />

  <!-- Label Y-Axis Waktu (ms) -->
  <text x="80" y="324" font-size="10" fill="#64748b" text-anchor="end">0 ms</text>
  <text x="80" y="244" font-size="10" fill="#64748b" text-anchor="end">60 ms</text>
  <text x="80" y="164" font-size="10" fill="#64748b" text-anchor="end">120 ms</text>
  <text x="80" y="84" font-size="10" fill="#64748b" text-anchor="end">180 ms</text>

  <!-- ================= BAR 1: Worker 0 (Sekuensial) ================= -->
  <!-- 136.8 ms -> height = 182px (y = 138) -->
  <rect x="160" y="138" width="80" height="182" fill="#ef4444" rx="4" />
  <text x="200" y="126" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">136.8 ms</text>
  <text x="200" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">0 Worker</text>
  <text x="200" y="360" font-size="10" fill="#64748b" text-anchor="middle">(Sekuensial Baseline)</text>

  <!-- ================= BAR 2: Worker 2 ================= -->
  <!-- 94.5 ms -> height = 126px (y = 194) -->
  <rect x="385" y="194" width="80" height="126" fill="#3b82f6" rx="4" />
  <text x="425" y="182" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">94.5 ms</text>
  <text x="425" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">2 Workers</text>
  <text x="425" y="360" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">Speedup: 1.45x (72.4%)</text>

  <!-- ================= BAR 3: Worker 4 ================= -->
  <!-- 92.5 ms -> height = 123px (y = 197) -->
  <rect x="610" y="197" width="80" height="123" fill="#10b981" rx="4" />
  <text x="650" y="185" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">92.5 ms</text>
  <text x="650" y="344" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">4 Workers</text>
  <text x="650" y="360" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">Speedup: 1.48x (37.0%)</text>

  <!-- Info Box Amdahl's Law (Bawah) -->
  <rect x="90" y="390" width="670" height="34" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="425" y="411" font-size="11" fill="#334155" text-anchor="middle">
    Efisiensi Paralel: Worker 2 = 72.4% · Worker 4 = 37.0% (Tervalidasi Sesuai Batas Teoretis Hukum Amdahl)
  </text>
</svg>
